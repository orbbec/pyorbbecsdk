# pytest configuration for the C++-parity auto_tests suite.
#
# This file deliberately does NOT reuse the repository-root "test/" suite:
# auto_tests mirrors OpenOrbbecSDK/tests (unit / hw / scenario / perf /
# destructive), while test/ is organised by device family.  Keeping the two
# apart avoids marker and statistics cross-contamination.
#
# All suite selection is done by run_tests.py through -m expressions; its
# module docstring describes the flow and the exit codes.

[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Keep the run reproducible: pytest's default tmp_path lives under the OS temp
# directory, which is not always writable in the locked-down CI images used for
# hardware regression.  Pin it inside the checkout instead.
addopts = --strict-markers --basetemp=.pytest_tmp

markers =
    unit: no device required - Context / Frame / Filter / logger / exceptions
    hardware: requires a physical device
    scenario: full device lifecycle plus SDK log completeness
    performance: timing sensitive benchmarks (drop rate, thread safety)
    destructive: changes device state persistently (reboot / force IP / firmware)
    network: exercises Ethernet discovery, needs network.enabled or OB_ENABLE_NETWORK_TESTS=1
    reboot: case reboots the device, excluded from the identity guard
    watchdog_probe: deliberately hanging probe used to verify the runner watchdog
    standalone: port of a non-GoogleTest C/C++ program (not a CTest label upstream)

# Keep the SDK log noise readable in run-all.log.
log_cli = false
log_level = WARNING
