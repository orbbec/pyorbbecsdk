[project]
name = "pyorbbecsdk2"
version = "2.1.3"
description = "pyorbbecsdk is a python wrapper for the OrbbecSDK"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
authors = [
    { name = "zhonghong", email = "zhonghong@orbbec.com" }
]
dependencies = [
    "av==12.3.0; python_version < '3.13'",
    "av==13.0.0; python_version == '3.13'",
    # av 13.x has no cp314 wheels; 15.1.0 is the first release with cp314 wheels on all platforms
    "av>=15.1.0; python_version >= '3.14'",
    "numpy<2.0.0; python_version >= '3.8' and python_version < '3.12'",
    "numpy>=2.1.0; python_version >= '3.12'",
    "opencv-python",
    # pygame has no cp314 wheels; pygame-ce is a drop-in replacement (same `import pygame`)
    "pygame; python_version < '3.14'",
    "pygame-ce; python_version >= '3.14'",
    "open3d==0.18.0; python_version >= '3.8' and python_version < '3.12'",
    # pynput on macOS requires pyobjc; pyobjc 11+ requires Python 3.9+
    "pynput; sys_platform != 'darwin'",
    "pynput; sys_platform == 'darwin' and python_version >= '3.9'",
    "pyobjc-core==10.3.2; sys_platform == 'darwin' and python_version < '3.9'",
    "pyobjc-framework-Quartz==10.3.2; sys_platform == 'darwin' and python_version < '3.9'",
    "pynput; sys_platform == 'darwin' and python_version < '3.9'",
]

[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
    # pybind11 3.0.0 is the first release with official Python 3.14 support
    "pybind11==2.12.0; python_version < '3.14'",
    "pybind11-global==2.12.0; python_version < '3.14'",
    "pybind11>=3.0.1,<4; python_version >= '3.14'",
    "pybind11-global>=3.0.1,<4; python_version >= '3.14'"
]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "auditwheel",
    "pyelftools<0.30",
    "pybind11-stubgen",
]

[tool.black]
target-version = ['py38']
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
skip_gitignore = true
